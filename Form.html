<!DOCTYPE html>
<html>
  <head><base target="_top"></head>
  <body>
    <div id="fields"></div>
    <br>
    <button id="btn-save" onclick="save()">Speichern</button>
    <button onclick="google.script.host.close()">Abbrechen</button>

    <script>
      const HEADERS  = [
        'Company', 'Position / Job Title', 'Location', 'Job URL', 'Folder', 'Category',
        'Job Type', 'Stage', 'Date Applied', 'Job Source', 'Salary Range',
        'Lebenslauf', 'Anschreiben', 'Dokumente', 'Bewerbungsportal (Ja/Nein)',
        'Notes', 'Interview Date', 'Next Step', 'Files & media'
      ];
      const REQUIRED    = ['Company', 'Position / Job Title', 'Job URL'];
      const DATES       = ['Date Applied', 'Interview Date'];
      const BOOL_CB     = ['Bewerbungsportal (Ja/Nein)'];
      const AUTO        = ['Folder'];        // server-seitig befüllt
      const FILE_UPLOAD = ['Files & media']; // Datei-Upload, separat behandelt

      const cfg = <?!= configJson ?>;

      const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

      document.getElementById('fields').innerHTML = HEADERS.map((h, i) => {
        if (AUTO.includes(h)) return '';
        const id  = 'f' + i;
        const req = REQUIRED.includes(h) ? ' *' : '';
        const c   = cfg[h];
        let field;

        if (FILE_UPLOAD.includes(h)) {
          field = `<input type="file" id="${id}">`;
        } else if (c?.type === 'multiselect') {
          field = `<div id="${id}">` +
            c.values.map(v => `<div><label><input type="checkbox" value="${esc(v)}"> ${esc(v)}</label></div>`).join('') +
            '</div>';
        } else if (c?.type === 'dropdown') {
          field = `<select id="${id}"><option value=""></option>` +
            c.values.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('') +
            '</select>';
        } else if (BOOL_CB.includes(h)) {
          field = `<input type="checkbox" id="${id}">`;
        } else if (DATES.includes(h)) {
          field = `<input type="date" id="${id}">`;
        } else if (h === 'Notes') {
          field = `<textarea id="${id}" rows="3" style="width:100%"></textarea>`;
        } else {
          field = `<input type="text" id="${id}" style="width:100%">`;
        }

        return `<p><b>${esc(h)}${req}</b><br>${field}</p>`;
      }).join('');

      // Standardwerte
      document.getElementById('f' + HEADERS.indexOf('Stage')).value = 'Not Started';
      document.getElementById('f' + HEADERS.indexOf('Date Applied')).value = new Date().toISOString().slice(0, 10);

      function save() {
        const data    = {};
        const missing = [];

        HEADERS.forEach((h, i) => {
          if (AUTO.includes(h) || FILE_UPLOAD.includes(h)) return;
          const id = 'f' + i;
          const c  = cfg[h];
          let val;

          if (c?.type === 'multiselect') {
            val = [...document.getElementById(id).querySelectorAll('input:checked')]
              .map(el => el.value).join(', ');
          } else if (BOOL_CB.includes(h)) {
            val = document.getElementById(id).checked ? 'TRUE' : 'FALSE';
          } else {
            val = document.getElementById(id).value.trim();
          }

          data[h] = val;
          if (REQUIRED.includes(h) && !val) missing.push(h);
        });

        const fileIdx   = HEADERS.indexOf('Files & media');
        const fileInput = document.getElementById('f' + fileIdx);
        const file      = fileInput?.files[0];
        if (!file) missing.push('Files & media');

        if (missing.length) { alert('Bitte ausfüllen:\n• ' + missing.join('\n• ')); return; }

        const btn = document.getElementById('btn-save');
        btn.disabled = true;
        btn.textContent = 'Speichern…';

        const submit = fileData => {
          google.script.run
            .withSuccessHandler(() => google.script.host.close())
            .withFailureHandler(e => {
              btn.disabled = false;
              btn.textContent = 'Speichern';
              alert('Fehler: ' + e.message);
            })
            .addRow(data, fileData);
        };

        if (file) {
          const reader = new FileReader();
          reader.onload = e => submit({
            base64:   e.target.result.split(',')[1],
            name:     file.name,
            mimeType: file.type || 'application/octet-stream'
          });
          reader.readAsDataURL(file);
        } else {
          submit(null);
        }
      }
    </script>
  </body>
</html>
